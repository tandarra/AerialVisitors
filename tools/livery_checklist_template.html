<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a work list, one airline per section, one row per aircraft type, two images per row (side, from below). */
:root{
  --bg:#efebe1; --surface:#f6f3ea; --fg:#141414; --mute:#6b665c; --line:#d6d0c2;
  --accent:#2c4a7a; --on-accent:#f6f3ea; --ok:#2f6b3a; --ok-bg:#e3ecdd; --hover:#fff8ec;
  --serif:Georgia,'Iowan Old Style','Times New Roman',serif; --mono:'Courier New',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1a1913; --surface:#232119; --fg:#ece6d4; --mute:#9b9480; --line:#3b382e;
  --accent:#8fb0e6; --on-accent:#14161c; --ok:#74b681; --ok-bg:#243126; --hover:#2c2a20; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1a1913; --surface:#232119; --fg:#ece6d4; --mute:#9b9480; --line:#3b382e;
  --accent:#8fb0e6; --on-accent:#14161c; --ok:#74b681; --ok-bg:#243126; --hover:#2c2a20; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg);font-family:var(--serif)}
body{margin:0;font-size:16px;line-height:1.4}
.wrap{max-width:1000px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{border-bottom:3px solid var(--fg);padding-block:22px 14px}
.kicker{font:600 11px/1.2 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
h1{margin:6px 0 10px;font-size:clamp(28px,5vw,44px);line-height:1.05;letter-spacing:-.01em;text-wrap:balance}
.prog{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;font:13px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.prog b{color:var(--fg);font-size:20px;font-family:var(--serif);letter-spacing:0}
.bar{height:10px;background:repeating-linear-gradient(90deg,color-mix(in srgb,var(--fg) 14%,transparent) 0 2px,transparent 2px 4px);margin:10px 0 12px;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--fg);transition:width .25s}
.opts{display:flex;gap:18px;flex-wrap:wrap;font:13px var(--mono);color:var(--mute)}
.opts label{display:flex;gap:7px;align-items:center;cursor:pointer}
.how{margin:16px 0 0;font-size:15px;color:var(--mute);max-width:68ch}
.how code,.cell code{font:12px var(--mono)}
#fb{margin:16px 0;border:1px solid var(--fg);background:var(--surface);padding:12px}
#fb p{margin:0 0 8px;font:13px var(--mono)}
#fb textarea{width:100%;font:12px var(--mono);background:var(--bg);color:var(--fg);border:1px solid var(--line);padding:8px}
section.al{padding-block:22px 4px}
section.al h2{margin:0;font-size:22px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;
  border-bottom:2px solid var(--fg);padding-bottom:6px}
section.al h2 small{font:11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:400}
.sub{font:12px var(--mono);color:var(--mute);margin:6px 0 0}
.row{display:grid;grid-template-columns:minmax(0,1.2fr) repeat(2,minmax(0,1fr));gap:12px;padding-block:12px;border-bottom:1px solid var(--line);align-items:start}
.row.hide{display:none}
.t{min-width:0}.t .n{font-weight:700;font-size:17px;line-height:1.2}.t .m{font:12px var(--mono);color:var(--mute);margin-top:3px;overflow-wrap:anywhere}
.cell{min-width:0;border:1px solid var(--line);background:var(--surface);padding:9px 10px;display:flex;flex-direction:column;gap:7px}
.cell.done{background:var(--ok-bg);border-color:var(--ok)}
.chk{display:flex;gap:8px;align-items:center;cursor:pointer;font:600 12px var(--mono);letter-spacing:.06em;text-transform:uppercase}
.chk input{width:18px;height:18px;accent-color:var(--ok);margin:0}
.cell code{color:var(--mute);overflow-wrap:anywhere}
button{font:13px var(--mono);border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);padding:7px 10px;cursor:pointer;text-align:center}
button:hover{filter:brightness(1.1)}
button.ok{background:transparent;color:var(--ok);border-color:var(--ok)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pend{font-size:14px;color:var(--mute);margin:8px 0 0}
.note{margin:28px 0 40px;font-size:14px;color:var(--mute);max-width:70ch;border-top:1px dashed var(--fg);padding-top:14px}
@media (max-width:640px){.row{grid-template-columns:1fr 1fr}.t{grid-column:1/-1}}
</style>
<header><div class="wrap">
  <div class="kicker">Aerial Visitors &middot; New Zealand</div>
  <h1>__TITLE__</h1>
  <div class="prog"><span><b id="done">0</b> of <b id="total">0</b> images painted</span><span id="sync"></span></div>
  <div class="bar"><i id="fill" style="width:0"></i></div>
  <div class="opts">
    <label><input type="checkbox" id="useref"> Add the style-reference line to copied prompts</label>
    <label id="rpl" hidden><input type="checkbox" id="userepaint"> Repaint mode: add the line for an attached approved airframe</label>
    <label><input type="checkbox" id="hidedone"> Hide finished rows</label>
  </div>
  <p class="how">__HOW__</p>
</div></header>
<main class="wrap">
  <div id="fb" hidden><p>Your browser blocked copying. The prompt is selected below: copy it from here.</p><textarea id="fbtext" rows="9" readonly></textarea></div>
  <div id="list"></div>
  <div class="note" id="note"></div>
</main>
<script type="application/json" id="pack">__DATA__</script>
<script>
const PACK = JSON.parse(document.getElementById("pack").textContent);
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const LS = "__STORE__";
let done = new Set(), col = null;

// ---- build the list once; later updates only toggle classes
const POSES = [["side", "Side profile", ""], ["below", "From below", "-2"]];
let total = 0;
$("list").innerHTML = PACK.airlines.map((al) => {
  const rows = (al.fleet || []).map((f) => {
    total += 2;
    const cells = POSES.map(([k, name]) => { const id = f.files[k].replace(/\.png$/, "");
      return `<div class="cell" data-cell="${id}"><label class="chk"><input type="checkbox" data-id="${id}"> ${name}</label>
        <code>${esc(f.files[k])}</code><button type="button" data-copy="${id}">Copy prompt</button></div>`; }).join("");
    return `<div class="row" data-row="${esc(f.slug)}"><div class="t"><div class="n">${esc(f.label)}</div>
      <div class="m">${f.count ? f.count + " flying · " : ""}ICAO ${esc(f.type)}${f.note ? " · " + esc(f.note) : ""}</div></div>${cells}</div>`;
  }).join("");
  const pend = (al.pending || []).map((f) => `${esc(f.label)} (${esc(f.note)})`).join("; ");
  return `<section class="al"><h2>${esc(al.name)}<small>${esc(al.base)}</small></h2><div class="sub">${esc(al.kind)}</div>${rows}
    ${pend ? `<p class="pend">Not flying yet: ${pend}</p>` : ""}</section>`;
}).join("");
$("total").textContent = total;
$("note").textContent = PACK.not_included || "";
if (PACK.repaint_line) $("rpl").hidden = false;

// prompts by id
const PROMPTS = {};
PACK.airlines.forEach((al) => (al.fleet || []).forEach((f) => POSES.forEach(([k]) => (PROMPTS[f.files[k].replace(/\.png$/, "")] = f.prompts[k]))));

function paint() {
  document.querySelectorAll("[data-id]").forEach((i) => (i.checked = done.has(i.dataset.id)));
  document.querySelectorAll("[data-cell]").forEach((c) => c.classList.toggle("done", done.has(c.dataset.cell)));
  const hide = $("hidedone").checked;
  document.querySelectorAll("[data-row]").forEach((r) => { const ids = [...r.querySelectorAll("[data-cell]")].map((c) => c.dataset.cell);
    r.classList.toggle("hide", hide && ids.every((x) => done.has(x))); });
  const n = [...done].filter((id) => id in PROMPTS).length;
  $("done").textContent = n; $("fill").style.width = (total ? n / total * 100 : 0) + "%";
}

// ---- remembering ticks: the page's db when it has one, this browser otherwise
function saveLocal() { try { localStorage.setItem(LS, JSON.stringify([...done])); } catch (e) {} }
const queue = new Map();
function persist(id, on) {
  if (!col) return saveLocal();
  const prev = queue.get(id) || Promise.resolve();
  queue.set(id, prev.then(() => (on ? col.doc(id).set({done: true, at: Date.now()}) : col.doc(id).delete()))
    .catch(() => { $("sync").textContent = "couldn't save, try again"; }));
}
document.addEventListener("change", (e) => {
  const el = e.target;
  if (el.id === "hidedone") return paint();
  if (!el.dataset.id) return;
  el.checked ? done.add(el.dataset.id) : done.delete(el.dataset.id);
  persist(el.dataset.id, el.checked); paint();
});

// ---- copying
async function copyPrompt(id, btn) {
  let text = PROMPTS[id] || "";
  if ($("useref").checked) text += "\n\n" + PACK.style_ref_line;
  if (PACK.repaint_line && $("userepaint").checked) text += "\n\n" + PACK.repaint_line;
  try { await navigator.clipboard.writeText(text); $("fb").hidden = true;
    btn.textContent = "Copied"; btn.classList.add("ok"); setTimeout(() => { btn.textContent = "Copy prompt"; btn.classList.remove("ok"); }, 1800); }
  catch (e) { $("fb").hidden = false; const t = $("fbtext"); t.value = text; t.focus(); t.select(); $("fb").scrollIntoView({block: "nearest"}); }
}
document.addEventListener("click", (e) => { const b = e.target.closest("[data-copy]"); if (b) copyPrompt(b.dataset.copy, b); });

paint();
try { const saved = JSON.parse(localStorage.getItem(LS) || "[]"); if (Array.isArray(saved)) { saved.forEach((x) => done.add(x)); paint(); } } catch (e) {}
(async () => {
  let db = null;
  try { db = window.claude && (await window.claude.use("db")); } catch (e) {}
  if (!db) { $("sync").textContent = "saved in this browser only"; return; }
  col = db.collection("done");
  col.onSnapshot((snap) => { done = new Set(snap.docs.map((d) => d.id)); paint(); saveLocal(); $("sync").textContent = "synced"; },
    () => { col = null; $("sync").textContent = "saved in this browser only"; });
})();
</script>
